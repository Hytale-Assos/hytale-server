name: "CI"

# Description: Lints the scripts/Dockerfiles, then builds the server image and
# publishes it to GitHub Packages (ghcr.io), where the Podman Quadlet pulls it.
#
# Images are tagged with the Hytale server RELEASE they are built for, read
# from Hypixel's public Maven metadata (no Hytale account needed):
#   :<hytale-version>  e.g. :0.6.8, rebuilt when our image changes
#   :latest            newest build, followed by `podman auto-update`
#
# - schedule (every 6 h): builds only when a new Hytale release is out
# - push to main:         always rebuilds for the current Hytale release
# - pull_request:         lint + build only, nothing is published
# - workflow_dispatch:    forced rebuild
#
# The image never contains Hytale files (EULA §3.3): the server is downloaded
# at runtime, so the tag means "built for", see report_hytale_version.
# Single image, linux/amd64 only: it targets our Rocky Linux 10 x86_64 host.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a run that may be publishing
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HYTALE_MAVEN_METADATA: https://maven.hytale.com/release/com/hypixel/hytale/Server/maven-metadata.xml

jobs:
  shellcheck:
    name: "🐚 ShellCheck"
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          severity: error
          ignore_paths: docs

  hadolint:
    name: "🐳 Hadolint"
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run Hadolint
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: Dockerfile.alpine
          failure-threshold: error

  version:
    name: "🔎 Resolve Hytale release"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      hytale_version: ${{ steps.resolve.outputs.hytale_version }}
      image: ${{ steps.resolve.outputs.image }}
      build: ${{ steps.decide.outputs.build }}
    steps:
      - name: Read latest release from Hypixel's Maven metadata
        id: resolve
        run: |
          set -euo pipefail
          METADATA=$(curl -fsS --retry 3 --retry-delay 5 "$HYTALE_MAVEN_METADATA")

          # Highest listed release, NOT <release>: that field is the last
          # published artifact, which can be a patch of an older line
          # (0.5.10 was published minutes before 0.6.8).
          HYTALE_VERSION=$(printf '%s\n' "$METADATA" \
            | grep -oE '<version>[^<]+</version>' \
            | sed -E 's#</?version>##g' \
            | grep -E '^[0-9]+(\.[0-9]+)*$' \
            | sort -V | tail -n 1)

          # Must also be a valid image tag
          if ! printf '%s' "$HYTALE_VERSION" | grep -qE '^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$'; then
            echo "::error::Could not resolve a Hytale release from $HYTALE_MAVEN_METADATA"
            exit 1
          fi

          echo "Latest Hytale release: $HYTALE_VERSION"
          {
            echo "hytale_version=$HYTALE_VERSION"
            # Registry paths must be lowercase (the org is "Hytale-Assos")
            echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/hytale-server"
          } >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Packages
        if: github.event_name == 'schedule'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide whether to build
        id: decide
        env:
          TAG: ${{ steps.resolve.outputs.image }}:${{ steps.resolve.outputs.hytale_version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] && docker manifest inspect "$TAG" >/dev/null 2>&1; then
            echo "$TAG already published, nothing to do."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  image:
    name: "📦 Build & publish image"
    needs: [shellcheck, hadolint, version]
    # Scheduled runs skip the lint jobs: only the source of the last push is built
    if: |
      always() &&
      needs.version.result == 'success' &&
      needs.version.outputs.build == 'true' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      HYTALE_VERSION: ${{ needs.version.outputs.hytale_version }}
      IMAGE: ${{ needs.version.outputs.image }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Compute tags
        id: meta
        run: |
          {
            echo "buildtime=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "tags<<EOF"
            echo "$IMAGE:$HYTALE_VERSION"
            echo "$IMAGE:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to GitHub Packages
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile.alpine
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            JRE=liberica
            HYTALE_TARGET_VERSION=${{ env.HYTALE_VERSION }}
            VERSION=${{ env.HYTALE_VERSION }}
            REVISION=${{ github.sha }}
            BUILDTIME=${{ steps.meta.outputs.buildtime }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
